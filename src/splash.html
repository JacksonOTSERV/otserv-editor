<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTServ Editor</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#060a0e}

  /* grid de fundo */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(180,130,40,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(180,130,40,.06) 1px,transparent 1px);
    background-size:40px 40px;
    animation:gridFade 1s ease forwards;
  }
  @keyframes gridFade{from{opacity:0}to{opacity:1}}

  /* vinheta radial */
  body::after{
    content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 30%,#060a0e 100%);
    pointer-events:none;
  }

  /* partículas flutuantes */
  .particles{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .p{
    position:absolute;bottom:-6px;border-radius:50%;
    background:rgba(200,155,50,.5);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(1);opacity:.5}
    100%{transform:translateY(-500px) scale(.3);opacity:0}
  }

  /* container central */
  .wrap{
    position:relative;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100vh;gap:0;
    animation:fadeIn .6s ease forwards;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ícone / emblema */
  .emblem{
    width:72px;height:72px;margin-bottom:18px;
    border:2px solid rgba(200,155,50,.4);
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    background:linear-gradient(145deg,#0e1318,#141b22);
    box-shadow:0 0 24px rgba(200,155,50,.15),inset 0 1px 0 rgba(255,255,255,.06);
  }
  .emblem svg{width:40px;height:40px;filter:drop-shadow(0 0 6px rgba(200,155,50,.5))}
  /* brilho pulsante no emblema */
  .emblem::after{
    content:'';position:absolute;inset:-1px;border-radius:16px;
    background:transparent;
    border:1px solid rgba(200,155,50,.0);
    animation:emblemGlow 2.4s ease-in-out infinite;
  }
  @keyframes emblemGlow{
    0%,100%{box-shadow:0 0 0 rgba(200,155,50,0)}
    50%{box-shadow:0 0 20px rgba(200,155,50,.3)}
  }

  /* título */
  .title{
    font-family:'Segoe UI',system-ui,sans-serif;
    font-size:28px;font-weight:700;letter-spacing:1px;
    color:#e8c96a;
    text-shadow:0 0 20px rgba(220,175,60,.4),0 0 60px rgba(220,175,60,.15);
  }
  .subtitle{
    font-family:'Segoe UI',system-ui,sans-serif;
    font-size:12px;font-weight:400;letter-spacing:3px;
    color:rgba(200,155,50,.5);
    text-transform:uppercase;margin-top:5px;
  }

  /* divisor */
  .divider{
    width:160px;height:1px;margin:20px 0;
    background:linear-gradient(90deg,transparent,rgba(200,155,50,.4),transparent);
  }

  /* barra de progresso */
  .bar-wrap{width:260px;height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
  .bar{
    height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,#7b5f1a,#e8c96a,#c89b30);
    box-shadow:0 0 8px rgba(220,175,60,.5);
    transition:width .08s linear;
  }

  /* status text */
  .status{
    font-family:'Segoe UI',system-ui,sans-serif;
    font-size:11px;color:rgba(200,155,50,.45);
    letter-spacing:.5px;margin-top:10px;
    height:16px;
    transition:opacity .3s;
  }

  /* versão */
  .version{
    position:fixed;bottom:14px;right:16px;z-index:20;
    font-family:'Segoe UI',system-ui,sans-serif;
    font-size:10px;color:rgba(200,155,50,.25);letter-spacing:.5px;
  }

  /* drag na janela sem decoração */
  html{-webkit-app-region:drag}
  .bar-wrap,.bar,.status{-webkit-app-region:no-drag}
</style>
</head>
<body>

<div class="particles" id="pts"></div>

<div class="wrap">
  <div class="emblem">
    <!-- ícone simples: espada + mapa -->
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="5" width="13" height="13" rx="2" fill="rgba(200,155,50,.15)" stroke="rgba(200,155,50,.6)" stroke-width="1.2"/>
      <rect x="22" y="5" width="13" height="13" rx="2" fill="rgba(200,155,50,.08)" stroke="rgba(200,155,50,.35)" stroke-width="1.2"/>
      <rect x="5" y="22" width="13" height="13" rx="2" fill="rgba(200,155,50,.08)" stroke="rgba(200,155,50,.35)" stroke-width="1.2"/>
      <rect x="22" y="22" width="13" height="13" rx="2" fill="rgba(200,155,50,.15)" stroke="rgba(200,155,50,.6)" stroke-width="1.2"/>
      <line x1="20" y1="4" x2="20" y2="36" stroke="rgba(200,155,50,.2)" stroke-width="1"/>
      <line x1="4" y1="20" x2="36" y2="20" stroke="rgba(200,155,50,.2)" stroke-width="1"/>
      <circle cx="20" cy="20" r="2.5" fill="rgba(220,175,60,.8)"/>
    </svg>
  </div>

  <div class="title">OTServ Editor</div>
  <div class="subtitle">Mapa &nbsp;·&nbsp; Sprites &nbsp;·&nbsp; Objetos</div>

  <div class="divider"></div>

  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Inicializando...</div>
</div>

<div class="version" id="ver">v0.1.0</div>

<script>
  // partículas
  const pts = document.getElementById('pts');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'p';
    const sz = 2 + Math.random() * 3;
    p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;`
      + `animation-duration:${4+Math.random()*6}s;animation-delay:${Math.random()*5}s;`
      + `opacity:${.2+Math.random()*.3}`;
    pts.appendChild(p);
  }

  // versão via Tauri (se disponível)
  if (window.__TAURI__) {
    window.__TAURI__.app.getVersion().then(v => {
      document.getElementById('ver').textContent = 'v' + v;
    }).catch(() => {});
  }

  // progresso
  const bar = document.getElementById('bar');
  const statusEl = document.getElementById('status');
  const steps = [
    [0,   'Carregando módulos...'],
    [20,  'Inicializando engine...'],
    [45,  'Verificando licença...'],
    [70,  'Verificando atualizações...'],
    [90,  'Pronto!'],
    [100, ''],
  ];
  let pct = 0;
  const TOTAL_MS = 2600;
  const TICK_MS = 40;
  const TOTAL_TICKS = TOTAL_MS / TICK_MS;
  let tick = 0;

  const iv = setInterval(() => {
    tick++;
    pct = Math.min(100, (tick / TOTAL_TICKS) * 100);
    bar.style.width = pct + '%';

    // atualiza status
    for (let i = steps.length - 1; i >= 0; i--) {
      if (pct >= steps[i][0]) { statusEl.textContent = steps[i][1]; break; }
    }

    if (pct >= 100) {
      clearInterval(iv);
      // fecha a própria janela via JS após 600ms (main window já está carregando por trás)
      setTimeout(async () => {
        try {
          const w = window.__TAURI__.window.getCurrentWindow();
          await w.close();
        } catch (e) {
          // fallback: fecha via Rust
          try { await window.__TAURI__.core.invoke('splash_done'); } catch (e2) {}
        }
      }, 600);
    }
  }, TICK_MS);
</script>
</body>
</html>
